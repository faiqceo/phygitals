<!-- phygitals/wallet.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wallet</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0c;--card:#171718;--card2:#202022;--line:#262628;--tx:#fff;--mut:#8a8a8f;--g1:#3ddc97;--g2:#0fb36f;--red:#ff5d5d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"SF Pro Display",Inter,system-ui,sans-serif;min-height:100vh;max-width:480px;margin:0 auto;padding:16px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--g1);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top h1{font-size:22px;flex:1}
.sq{width:44px;height:44px;border-radius:14px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center}
.hero{border-radius:26px;padding:26px;background:linear-gradient(135deg,#143b2c,#1a1a1c 70%);border:1px solid #1f3a2f;margin-bottom:14px}
.hero small{color:var(--g1);font-weight:600;letter-spacing:.14em;font-size:12px}
.hero b{display:block;font-size:48px;margin-top:14px;letter-spacing:-.02em}
.list{background:var(--card);border:1px solid var(--line);border-radius:22px;margin-bottom:16px}
.row{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .n{flex:1;font-weight:600}
.row .tag{font-size:11px;color:var(--mut);background:var(--card2);padding:3px 9px;border-radius:99px;margin-left:8px;font-weight:600}
.ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}
.ic.p{background:#183327;color:var(--g1)}.ic.u{background:#2775ca}.ic.t{background:#26a17b}
.pos{color:var(--g1)}
.cta{width:100%;height:60px;border-radius:99px;font-weight:700;font-size:17px;background:linear-gradient(90deg,var(--g1),var(--g2));color:#04140d;margin-bottom:16px}
.cta[disabled]{opacity:.4}
.wd{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:16px}
.wd h2{font-size:12px;color:var(--mut);letter-spacing:.12em;margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:20px 8px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:10px}
.tile i{width:56px;height:56px;border-radius:50%;background:#183327;color:var(--g1);display:grid;place-items:center;font-style:normal;font-size:22px}
.addr{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px}
.addr div{flex:1}.addr small{color:var(--mut);display:block}.addr code{font-weight:700}
.copy{background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-weight:600}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#121213;border-radius:28px 28px 0 0;padding:12px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;max-height:94vh;overflow:auto}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:#3a3a3d;margin:0 auto 14px}
.sh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pill{background:var(--card2);padding:8px 14px;border-radius:99px;font-size:14px;color:var(--mut)}
.big{font-size:64px;font-weight:700;text-align:center;margin:18px 0 4px;letter-spacing:-.03em}
.sub{text-align:center;color:var(--mut);font-size:14px;min-height:20px}
.chips{display:flex;gap:8px;margin:18px 0 8px}
.chips button{flex:1;padding:12px 0;border-radius:99px;background:var(--card2);color:var(--mut);font-weight:600;border:1px solid var(--line)}
.chips button.on{background:#143b2c;color:var(--g1);border-color:#1f5a41}
.pad{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:12px}
.pad button{height:62px;font-size:26px;font-weight:600}
.white{width:100%;height:58px;border-radius:99px;background:#fff;color:#000;font-weight:700;font-size:17px}
.link{display:block;margin:12px auto 0;color:var(--mut);font-size:14px}
.sheet h3{font-size:28px;margin:8px 0 4px}
.sheet p.d{color:var(--mut);margin-bottom:16px}
.lbl{font-size:12px;color:var(--mut);letter-spacing:.1em;margin:14px 0 8px}
.field{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:16px;color:var(--tx);font:inherit}
.sum{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 16px;margin:14px 0}
.sum div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.sum div:last-child{border:0;font-weight:700}
.sum span:first-child{color:var(--mut)}.sum div:last-child span:first-child{color:var(--tx)}
.dark{width:100%;height:58px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-weight:700;margin-top:10px}
.qr{width:150px;height:150px;margin:14px auto;border-radius:16px;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/20px 20px;border:8px solid #fff}
.warn{color:#e8c46a;font-size:13px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#fff;color:#000;padding:12px 20px;border-radius:99px;font-weight:600;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top">
  <button class="sq" aria-label="Back" onclick="Tg.close()">←</button>
  <h1>Wallet</h1>
  <button class="sq" aria-label="Refresh" onclick="refresh()">⟳</button>
</div>

<div class="hero"><small>AVAILABLE</small><b id="avail">$0.00</b></div>

<div class="list">
  <div class="row"><div class="ic p">◎</div><div class="n">Pack Credits</div><b class="pos" id="b-pack">$0.00</b></div>
  <div class="row"><div class="ic u">$</div><div class="n">USDC<span class="tag">Solana</span></div><b id="b-usdc">$0.00</b></div>
  <div class="row"><div class="ic t">₮</div><div class="n">USDT<span class="tag">Solana</span></div><b id="b-usdt">$0.00</b></div>
</div>

<button class="cta" onclick="openAdd()">+&nbsp; Add Funds</button>

<div class="wd">
  <h2>WITHDRAW</h2>
  <div class="two">
    <button class="tile" onclick="openWd('bank')"><i>🏛</i>To Bank</button>
    <button class="tile" onclick="openWd('wallet')"><i>➤</i>To Wallet</button>
  </div>
  <button class="dark" style="margin-top:12px" onclick="openWhoop()">Withdraw to Whoop Wallet</button>
</div>

<div class="addr">
  <div class="ic p">▣</div>
  <div><small>Your wallet</small><code id="addr-s"></code></div>
  <button class="copy" onclick="copyAddr()">Copy</button>
</div>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
/* ---- Config: placeholders, set real values from your backend ---- */
const CFG={cardPct:0.10,cardFlat:0.21,       // $5 -> $0.71 like the design
           netFee:0.50,bankPct:0.01,minWd:5,
           address:"Gv9xGpQ4mT2rKd8LbXn3VhY7sUeW1jZcAoPq5RtX7cvo"};
const S={pack:0,usdc:0.10,usdt:0};   // dummy data
const Tg=(window.Telegram&&Telegram.WebApp)||{ready(){},expand(){},close(){},HapticFeedback:null,setHeaderColor(){},setBackgroundColor(){}};
Tg.ready();Tg.expand();try{Tg.setHeaderColor("#0b0b0c");Tg.setBackgroundColor("#0b0b0c")}catch(e){}

const $=id=>document.getElementById(id);
const m=n=>"$"+n.toFixed(2);
const short=a=>a.slice(0,6)+"..."+a.slice(-5);
function render(){
  $("b-pack").textContent=m(S.pack);$("b-usdc").textContent=m(S.usdc);$("b-usdt").textContent=m(S.usdt);
  $("avail").textContent=m(S.pack+S.usdc+S.usdt);$("addr-s").textContent=short(CFG.address);
}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)}
function haptic(){try{Tg.HapticFeedback&&Tg.HapticFeedback.impactOccurred("light")}catch(e){}}
function refresh(){haptic();render();toast("Balances updated")}
function copyAddr(){navigator.clipboard&&navigator.clipboard.writeText(CFG.address).catch(()=>{});toast("Address copied")}
function openSheet(html){$("sheet").innerHTML='<div class="grab"></div>'+html;$("scrim").classList.add("on");$("sheet").classList.add("on")}
function closeSheet(){clearInterval(actTimer);$("scrim").classList.remove("on");$("sheet").classList.remove("on")}

/* ---- Add funds: card / Apple Pay ---- */
let amt="5";
function fee(a){return a>0?+(a*CFG.cardPct+CFG.cardFlat).toFixed(2):0}
function openAdd(){amt="5";
  openSheet(`<div class="sh-top"><span class="pill">Balance: <span id="a-bal"></span></span><button class="sq" aria-label="Close" onclick="closeSheet()">✕</button></div>
  <div class="big" id="a-amt"></div><div class="sub" id="a-fee"></div>
  <div class="chips" id="chips"></div>
  <div class="pad" id="pad"></div>
  <button class="white" id="a-pay" onclick="pay()"></button>
  <button class="link" onclick="openCrypto()">Deposit crypto instead</button>`);
  $("a-bal").textContent=m(S.pack+S.usdc+S.usdt);
  $("chips").innerHTML=[5,25,50,1000].map(v=>`<button data-v="${v}" onclick="setAmt('${v}')">$${v.toLocaleString()}</button>`).join("");
  $("pad").innerHTML=["1","2","3","4","5","6","7","8","9","","0","⌫"].map(k=>k?`<button onclick="key('${k}')" aria-label="${k==='⌫'?'Delete':k}">${k}</button>`:"<span></span>").join("");
  upAdd();
}
function setAmt(v){amt=v;upAdd()}
function key(k){if(k==="⌫")amt=amt.slice(0,-1);else if(amt.length<5)amt=(amt==="0"?"":amt)+k;upAdd()}
function upAdd(){const a=+amt||0,f=fee(a);
  $("a-amt").textContent="$"+(amt||"0");
  $("a-fee").textContent=a?`+ card fees: ${m(f)} · You get ${m(a)} pack credits`:"Enter an amount";
  document.querySelectorAll("#chips button").forEach(b=>b.classList.toggle("on",b.dataset.v===amt));
  const p=$("a-pay");p.textContent=a?`Pay ${m(a+f)} with Apple Pay`:"Pay with Apple Pay";p.disabled=!a;p.style.opacity=a?1:.4}
function pay(){const a=+amt;if(!a)return;haptic();
  /* TODO: call backend to create payment; credit only after it confirms */
  S.pack+=a;render();closeSheet();toast(m(a)+" added to Pack Credits")}

/* ---- Add funds: crypto ---- */
function openCrypto(){
  openSheet(`<div class="sh-top"><button class="sq" aria-label="Back" onclick="openAdd()">←</button><b>Deposit</b><span style="width:44px"></span></div>
  <h3>Add funds</h3><p class="d">Pick a network and token, then generate a deposit address.</p>
  <div class="lbl">NETWORK</div>
  <select class="field" id="net"><option>Solana · low fees</option></select>
  <div class="lbl">TOKEN</div>
  <select class="field" id="tok"><option>USDC · Stablecoin</option><option>USDT · Stablecoin</option></select>
  <button class="dark" onclick="showAddr()">Show deposit address</button>`);
}
function showAddr(){const t=$("tok").value.split(" ")[0];
  openSheet(`<div class="sh-top"><button class="sq" aria-label="Back" onclick="openCrypto()">←</button><b>${t} on Solana</b><span style="width:44px"></span></div>
  <div class="qr" role="img" aria-label="QR code placeholder"></div>
  <p class="d" style="text-align:center;word-break:break-all"><code>${CFG.address}</code></p>
  <button class="white" onclick="copyAddr()">Copy address</button>
  <p class="warn" style="text-align:center">Only send ${t} on Solana to this address. Other tokens or networks will be lost.</p>`);
}

/* ---- Withdraw ---- */
let wd={type:"wallet",tok:"usdc"};
function openWd(type){wd={type,tok:"usdc"};
  const bank=type==="bank";
  openSheet(`<div class="sh-top"><button class="sq" aria-label="Close" onclick="closeSheet()">✕</button><b>Withdraw to ${bank?"bank":"wallet"}</b><span style="width:44px"></span></div>
  <div class="lbl">FROM</div>
  <select class="field" id="w-tok" onchange="wd.tok=this.value;upWd()"><option value="usdc">USDC · Solana</option><option value="usdt">USDT · Solana</option></select>
  <div class="lbl">AMOUNT</div>
  <input class="field" id="w-amt" inputmode="decimal" placeholder="0.00" oninput="upWd()">
  <div class="lbl">${bank?"BANK ACCOUNT NUMBER":"SOLANA WALLET ADDRESS"}</div>
  <input class="field" id="w-to" placeholder="${bank?"Account number":"Paste address"}" oninput="upWd()">
  <div class="sum">
    <div><span>Amount</span><span id="s-a">$0.00</span></div>
    <div><span>${bank?"Payout fee (1%) + network":"Network fee"}</span><span id="s-f">$0.00</span></div>
    <div><span>You receive</span><span id="s-r">$0.00</span></div>
  </div>
  <p class="warn" id="w-err"></p>
  <button class="white" id="w-go" onclick="doWd()">Confirm withdrawal</button>`);
  upWd();
}
function wdFee(a){return a?+(CFG.netFee+(wd.type==="bank"?a*CFG.bankPct:0)).toFixed(2):0}
function upWd(){const a=+$("w-amt").value||0,f=wdFee(a),bal=S[wd.tok];let err="";
  if(a&&a<CFG.minWd)err="Minimum withdrawal is "+m(CFG.minWd);
  else if(a>bal)err="Amount is more than your "+wd.tok.toUpperCase()+" balance ("+m(bal)+")";
  else if(a&&f>=a)err="Amount doesn’t cover the fee";
  $("s-a").textContent=m(a);$("s-f").textContent=m(f);$("s-r").textContent=m(Math.max(a-f,0));
  $("w-err").textContent=err;
  $("w-go").disabled=!a||!!err||!$("w-to").value.trim();$("w-go").style.opacity=$("w-go").disabled?.4:1}
function doWd(){const a=+$("w-amt").value;haptic();
  /* TODO: backend call; show real tx status */
  S[wd.tok]-=a;render();closeSheet();toast("Withdrawal submitted")}

/* ---- Withdraw to Whoop Wallet (real backend; nothing here changes a balance locally) ---- */
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(method,url,body){
  const r=await fetch(url,{method,headers:{"Content-Type":"application/json","X-Telegram-Init-Data":Tg.initData||""},body:body?JSON.stringify(body):undefined});
  let d={};try{d=await r.json()}catch(e){}
  return{status:r.status,ok:r.ok,data:d};
}
let wh={st:null,amt:"",key:null};
function whoopTop(title,back){return `<div class="sh-top"><button class="sq" aria-label="${back?"Back":"Close"}" onclick="${back||"closeSheet()"}">${back?"←":"✕"}</button><b>${title}</b><span style="width:44px"></span></div>`}
async function openWhoop(){
  openSheet(whoopTop("Whoop Wallet")+'<p class="d">Loading…</p>');
  const r=await api("GET","/api/whoop/status");
  if(!r.ok){openSheet(whoopTop("Whoop Wallet")+`<p class="warn">${esc(r.data.error||"Could not load. Open this from Telegram.")}</p>`);return}
  wh.st=r.data;
  if(!wh.st.configured){openSheet(whoopTop("Whoop Wallet")+'<p class="warn">Whoop Wallet withdrawals are not switched on yet.</p>');return}
  if(!wh.st.linked)return whoopLink();
  (wh.st.activation&&!wh.st.activation.paid)?whoopActivate():whoopForm();
}
/* ---- One-time activation fee (paid in SOL to the deposit address) ---- */
let actTimer=null;
async function whoopActivate(){
  const r=await api("GET","/api/whoop/activation");
  if(!r.ok){openSheet(whoopTop("Activate withdrawals")+`<p class="warn">${esc(r.data.error||"Could not load.")}</p>`);return}
  const a=r.data;if(a.paid){wh.st.activation.paid=true;return whoopForm()}
  let qr="";try{const q=qrcode(0,"M");q.addData(a.url);q.make();qr=q.createSvgTag(4)}catch(e){}
  openSheet(whoopTop("Activate withdrawals")+`
  <p class="d">One-time activation fee: send <b>${a.sol} SOL</b> (about $3) to the address below. You pay this once, on your first withdrawal. After that there is no per-withdrawal fee. It is not refundable and is separate from your balance.</p>
  ${qr?`<div style="background:#fff;border-radius:16px;padding:14px;width:200px;margin:12px auto">${qr}</div>`:""}
  <div class="row" style="background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:14px 16px"><span class="n" style="word-break:break-all;font-size:12px">${esc(a.address)}</span></div>
  <button class="link" onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(a.address)}').then(()=>toast('Address copied'))">Copy address</button>
  <a class="link" href="${esc(a.url)}">Open in wallet</a>
  <p class="d" id="act-s">Waiting for SOL payment…</p>`);
  clearInterval(actTimer);let n=0;
  actTimer=setInterval(async()=>{
    if(++n>100){clearInterval(actTimer);const e=$("act-s");if(e)e.textContent="Still waiting. You can close this; it unlocks once the payment is confirmed.";return}
    const x=await api("GET","/api/whoop/activation");
    if(x.ok&&x.data.paid){clearInterval(actTimer);wh.st.activation.paid=true;toast("Activation complete");whoopForm()}
  },4000);
}
function whoopLink(msg){
  openSheet(whoopTop("Connect Whoop Wallet")+`<p class="d">Open Whoop Wallet, go to Profile, then Phygitals, and tap <b>Generate link code</b>. Enter the code here. You only do this once.</p>
  <div class="lbl">LINK CODE</div>
  <input class="field" id="wl-code" placeholder="ABCD-EFGH" autocapitalize="characters" autocomplete="off" maxlength="9">
  <p class="warn" id="wl-err">${msg?esc(msg):""}</p>
  <button class="white" id="wl-go" onclick="doLink()">Connect</button>`);
}
async function doLink(){
  const code=$("wl-code").value.trim();if(!code)return;
  $("wl-go").disabled=true;
  const r=await api("POST","/api/whoop/link",{code});
  if(r.ok){wh.st=r.data;toast("Whoop Wallet connected");whoopForm()}else whoopLink(r.data.error||"Could not connect.");
}
async function doUnlink(){
  const r=await api("POST","/api/whoop/unlink");
  if(r.ok){wh.st=r.data;toast("Disconnected");whoopLink()}else{$("wf-err").textContent=r.data.error||"Could not disconnect."}
}
function whoopForm(){
  const st=wh.st;
  openSheet(whoopTop("Withdraw to Whoop")+`
  <div class="lbl">DESTINATION</div>
  <div class="row" style="background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:14px 16px"><span class="n">@${esc(st.whoopUsername)}</span><span class="tag">Whoop Wallet</span></div>
  <button class="link" onclick="doUnlink()">Disconnect this wallet</button>
  <div class="lbl">AMOUNT · AVAILABLE ${m(st.available)}</div>
  <input class="field" id="wf-amt" inputmode="decimal" placeholder="0.00" value="${esc(wh.amt)}" oninput="upWhoop()">
  <div class="sum">
    <div><span>Amount</span><span id="wf-a">$0.00</span></div>
    <div><span>Phygitals service fee</span><span id="wf-f">${m(st.fee)}</span></div>
    <div><span>Whoop Wallet receives</span><span id="wf-r">$0.00</span></div>
  </div>
  <p class="d">${st.fee>0?"The service fee is charged by Phygitals. It is not a network fee.":"No per-withdrawal fee. The one-time activation fee covers this."}</p>
  <p class="warn" id="wf-err"></p>
  <button class="white" id="wf-go" onclick="whoopReview()">Review withdrawal</button>`);
  upWhoop();
}
function whoopAmt(){const v=$("wf-amt").value.trim();return /^\d{1,7}(\.\d{1,2})?$/.test(v)?+v:0}
function upWhoop(){
  const st=wh.st,a=whoopAmt();let err="";
  wh.amt=$("wf-amt").value;
  if($("wf-amt").value&&!a)err="Enter an amount with up to 2 decimals";
  else if(a&&a<st.min)err="Minimum withdrawal is "+m(st.min);
  else if(a>st.available)err="More than your available balance ("+m(st.available)+")";
  else if(a&&a<=st.fee)err="Amount doesn’t cover the service fee";
  $("wf-a").textContent=m(a);$("wf-r").textContent=m(Math.max(a-st.fee,0));$("wf-err").textContent=err;
  const b=$("wf-go");b.disabled=!a||!!err;b.style.opacity=b.disabled?.4:1;
}
async function whoopReview(){
  const a=whoopAmt();if(!a)return;
  const r=await api("GET","/api/whoop/quote?amount="+a.toFixed(2));
  if(r.status===402)return whoopActivate();
  if(!r.ok){$("wf-err").textContent=r.data.error||"Could not get a quote.";return}
  const q=r.data;wh.q=q;wh.key=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2)).replace(/[^A-Za-z0-9_-]/g,"")+"0000";
  openSheet(whoopTop("Confirm withdrawal","whoopForm()")+`
  <div class="sum">
    <div><span>To</span><span>${esc(q.destination)} (Whoop Wallet)</span></div>
    <div><span>Withdraw from Phygitals</span><span>${m(q.amount)}</span></div>
    <div><span>Phygitals service fee</span><span>${m(q.fee)}</span></div>
    <div><span>Whoop Wallet receives</span><span>${m(q.receive)}</span></div>
  </div>
  <p class="d">You are approving this transfer to your connected Whoop Wallet. Your balance is only reduced after Whoop Wallet confirms it received the funds.</p>
  <p class="warn" id="wc-err"></p>
  <button class="white" id="wc-go" onclick="whoopConfirm()">Confirm and withdraw ${m(q.amount)}</button>`);
}
async function whoopConfirm(){
  const q=wh.q;$("wc-go").disabled=true;$("wc-go").textContent="Sending…";
  const r=await api("POST","/api/whoop/withdraw",{amount:q.amount.toFixed(2),expectedFee:q.fee,confirm:true,idempotencyKey:wh.key});
  if(r.status===402)return whoopActivate();
  if(r.status===200||r.status===202||r.status===422)return whoopResult(r.data);
  $("wc-err").textContent=r.data.error||"Something went wrong. You were not charged.";
  $("wc-go").disabled=false;$("wc-go").textContent="Try again";   /* same key, so a retry can never pay twice */
}
async function whoopResult(w){
  const show=(title,body)=>openSheet(whoopTop(title)+`<p class="d">${body}</p><button class="white" onclick="closeSheet();loadMe()">Done</button>`);
  if(w.status==="completed"){toast("Withdrawal confirmed");return show("Withdrawal complete",`${m(w.receive)} was added to ${esc(w.destination)} on Whoop Wallet. Reference: <code>${esc(w.whoopTxId||w.id)}</code>`)}
  if(w.status==="failed")return show("Withdrawal failed",`${esc(w.error||"Whoop Wallet declined the transfer.")} Your balance was not changed.`);
  openSheet(whoopTop("Processing…")+'<p class="d">Waiting for Whoop Wallet to confirm. Your balance is held, not spent. You can close this and check back.</p>');
  for(let i=0;i<20;i++){
    await new Promise(r=>setTimeout(r,3000));
    const r=await api("GET","/api/whoop/withdrawals/"+encodeURIComponent(w.id));
    if(r.ok&&r.data.status!=="pending")return whoopResult(r.data);
  }
  show("Still processing","This is taking longer than usual. Your balance stays held until Whoop Wallet confirms, and it will finish automatically.");
}
async function loadMe(){const r=await api("GET","/api/me");if(r.ok){S.pack=r.data.credits||0;render()}}

render();
</script>
</body>
</html>
